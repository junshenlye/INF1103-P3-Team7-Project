name: Tests

on:
  push:
    branches: [main, redesign-scope]
  pull_request:

permissions:
  contents: read

jobs:
  project-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run function, frontend and Docker workflow tests
        run: ./tests/run.sh all
