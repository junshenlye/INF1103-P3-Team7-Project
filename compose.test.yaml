services:
  test-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stackplan_test
      POSTGRES_USER: stackplan_test
      POSTGRES_PASSWORD: stackplan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackplan_test -d stackplan_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://stackplan_test:stackplan_test@test-database:5432/stackplan_test
    depends_on:
      test-database:
        condition: service_healthy
    command: ["-q", "-p", "no:cacheprovider"]
