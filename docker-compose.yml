services:
  backend:
    build: .
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-stackplan}:${POSTGRES_PASSWORD:-stackplan_dev}@db:5432/${POSTGRES_DB:-stackplan}
      AI_PRECHECK_MODEL: ${AI_PRECHECK_MODEL:-qwen3.7-flash}
      AI_CONTEXT_MODEL: ${AI_CONTEXT_MODEL:-qwen3.7-plus}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-qwen3.7-plus}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-2}
      AI_MODEL_TIMEOUT_SECONDS: ${AI_MODEL_TIMEOUT_SECONDS:-45}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-240}
      AI_MODEL_RETRIES: ${AI_MODEL_RETRIES:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./.runtime-uploads:/app/uploads:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stackplan}
      POSTGRES_USER: ${POSTGRES_USER:-stackplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackplan_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackplan} -d ${POSTGRES_DB:-stackplan}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Test-only storage. Restarting or stopping this container clears the database.
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
